name: Multi-platform Release Packaging

on:
  push:
    # O gatilho para release será quando você subir uma tag (ex: v1.0.0)
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # --- LINUX BUILD ---
      - name: Build and Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y fuse libfuse2 file
          cargo install cargo-deb cargo-generate-rpm
          cargo build --release
          cargo deb --no-build --output dfnotes-debian.deb
          cargo generate-rpm --output dfnotes-redhat.rpm
          
          # AppImage
          curl -L https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp target/release/dfnotes AppDir/usr/bin/
          cp dfnotes.desktop AppDir/ 2>/dev/null || touch AppDir/dfnotes.desktop
          cp assets/dfnotes.png AppDir/ 2>/dev/null || touch AppDir/dfnotes.png
          echo -e '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "${HERE}/usr/bin/dfnotes" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          ARCH=x86_64 ./appimagetool AppDir dfnotes-appimage.appimage

      # --- WINDOWS BUILD ---
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --release
          cp target/release/dfnotes.exe dfnotes-windows.exe

      # --- MACOS BUILD ---
      - name: Build and Package MacOS
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release
          pip3 install dmgbuild --break-system-packages
          mkdir -p dist_macos
          cp target/release/dfnotes dist_macos/
          dmgbuild -s /dev/null -D app_folder=dist_macos "dfnotes" dfnotes-macos.dmg

      # --- GENERATE HASHES ---
      - name: Generate SHA-256 Hashes
        shell: bash
        run: |
          for file in dfnotes-*; do
            if [ -f "$file" ]; then
              shasum -a 256 "$file" > "${file}.sha256"
            fi
          done

      # --- UPLOAD TO RELEASE ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dfnotes-debian.deb
            dfnotes-redhat.rpm
            dfnotes-appimage.appimage
            dfnotes-windows.exe
            dfnotes-macos.dmg
            dfnotes-*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}