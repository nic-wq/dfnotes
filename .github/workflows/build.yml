
name: Multi-platform Release Packaging

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-artifacts
          - os: windows-latest
            artifact_name: windows-artifacts
          - os: macos-latest
            artifact_name: macos-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # --- LINUX BUILD (Debian, RPM, AppImage) ---
      - name: Build and Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Install dependencies and packaging tools
          sudo apt-get update && sudo apt-get install -y fuse libfuse2 file
          cargo install cargo-deb cargo-generate-rpm
          
          cargo build --release
          
          # 1. Generate Debian package
          cargo deb --no-build --output dfnotes-debian.deb
          
          # 2. Generate RPM package
          cargo generate-rpm --output dfnotes-redhat.rpm
          
          # 3. Generate AppImage
          # Improved download for appimagetool
          curl -L https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          
          # Setup AppDir structure
          mkdir -p AppDir/usr/bin
          cp target/release/dfnotes AppDir/usr/bin/
          cp dfnotes.desktop AppDir/
          cp assets/dfnotes.png AppDir/
          
          # Create AppRun script
          echo -e '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "${HERE}/usr/bin/dfnotes" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          
          # Build AppImage
          ARCH=x86_64 ./appimagetool AppDir dfnotes-appimage.appimage

      # --- WINDOWS BUILD (.exe) ---
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --release
          cp target/release/dfnotes.exe dfnotes-windows.exe

      # --- MACOS BUILD (.dmg) ---
      - name: Build and Package MacOS
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release
          # Using --break-system-packages to bypass PEP 668 on CI
          pip3 install dmgbuild --break-system-packages
          
          mkdir -p dist_macos
          cp target/release/dfnotes dist_macos/
          
          # Create DMG
          dmgbuild -s /dev/null -D app_folder=dist_macos "dfnotes" dfnotes-macos.dmg

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Finished Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dfnotes-debian.deb
            dfnotes-redhat.rpm
            dfnotes-appimage.appimage
            dfnotes-windows.exe
            dfnotes-macos.dmg
          if-no-files-found: ignore