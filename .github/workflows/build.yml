name: Multi-platform Packaging

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build e Packaging
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pacotes-linux
          - os: windows-latest
            artifact_name: pacotes-windows
          - os: macos-latest
            artifact_name: binario-macos

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    # --- LINUX (Debian, RPM, IMG) ---
    - name: Build e Pacotes (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        # Instala as ferramentas de empacotamento
        cargo install cargo-deb cargo-generate-rpm
        
        cargo build --release
        
        # Gera o .deb
        cargo deb --no-build --output dfnotes.deb
        
        # Gera o .rpm (agora com os metadados do Cargo.toml)
        cargo generate-rpm --output dfnotes.rpm
        
        # Gera o .img (cópia simples do binário)
        cp target/release/dfnotes dfnotes.img

    # --- WINDOWS (.exe) ---
    - name: Build (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cargo build --release
        copy target\release\dfnotes.exe dfnotes.exe

    # --- MACOS ---
    - name: Build (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        cargo build --release
        cp target/release/dfnotes dfnotes-macos

    # --- UPLOAD ---
    - name: Upload de Arquivos
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          dfnotes.deb
          dfnotes.rpm
          dfnotes.img
          dfnotes.exe
          dfnotes-macos
        if-no-files-found: ignore
