name: Multi-platform Packaging

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-packages
          - os: windows-latest
            artifact_name: windows-packages
          - os: macos-latest
            artifact_name: macos-binaries

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    # --- LINUX SPECIFIC STEPS ---
    - name: Install Packaging Tools (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cargo install cargo-deb
        cargo install cargo-generate-rpm

    - name: Build and Package (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cargo build --release
        # Generate .deb
        cargo deb --no-build --output dfnotes.deb
        # Generate .rpm
        cargo generate-rpm --output dfnotes.rpm
        # Generate .img (Copying binary to img format)
        cp target/release/dfnotes dfnotes.img

    # --- WINDOWS SPECIFIC STEPS ---
    - name: Build (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cargo build --release
        copy target\release\dfnotes.exe dfnotes.exe

    # --- MACOS SPECIFIC STEPS ---
    - name: Build (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        cargo build --release
        cp target/release/dfnotes dfnotes-macos

    # --- UPLOAD ARTIFACTS ---
    - name: Upload Linux Artifacts
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          dfnotes.deb
          dfnotes.rpm
          dfnotes.img

    - name: Upload Windows Artifacts
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dfnotes.exe

    - name: Upload macOS Artifacts
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dfnotes-macos