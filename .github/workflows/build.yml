name: Multi-platform Packaging

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Packaging
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: packages-linux
          - os: windows-latest
            artifact_name: packages-windows
          - os: macos-latest
            artifact_name: binary-macos

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    # --- LINUX (Debian, RPM, IMG) ---
    - name: Build and Packages (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        # Install packaging tools
        cargo install cargo-deb cargo-generate-rpm
        
        cargo build --release
        
        # Generate the .deb
        cargo deb --no-build --output dfnotes.deb
        
        # Generate the .rpm (now with Cargo.toml metadata)
        cargo generate-rpm --output dfnotes.rpm
        
        # Generate the .img (simple copy of the binary)
        cp target/release/dfnotes dfnotes.img

    # --- WINDOWS (.exe) ---
    - name: Build (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cargo build --release
        copy target\release\dfnotes.exe dfnotes.exe

    # --- MACOS ---
    - name: Build (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        cargo build --release
        cp target/release/dfnotes dfnotes-macos

    # --- UPLOAD ---
    - name: Upload Files
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          dfnotes.deb
          dfnotes.rpm
          dfnotes.img
          dfnotes.exe
          dfnotes-macos
        if-no-files-found: ignore
