name: Multi-platform Release Packaging

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-artifacts
          - os: windows-latest
            artifact_name: windows-artifacts
          - os: macos-latest
            artifact_name: macos-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # --- LINUX BUILD (Debian, RPM, AppImage) ---
      - name: Build and Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Install packaging tools
          sudo apt-get update && sudo apt-get install -y fuse libfuse2
          cargo install cargo-deb cargo-generate-rpm
          
          # Standard build
          cargo build --release
          
          # 1. Generate Debian package
          cargo deb --no-build --output dfnotes-debian.deb
          
          # 2. Generate RPM package
          cargo generate-rpm --output dfnotes-redhat.rpm
          
          # 3. Generate AppImage
          # Using a simplified approach: downloading appimagetool
          curl -LO https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # Create AppDir structure for AppImage
          mkdir -p AppDir/usr/bin
          cp target/release/dfnotes AppDir/usr/bin/
          cp dfnotes.desktop AppDir/
          cp assets/dfnotes.png AppDir/
          # Create a simple AppRun script
          echo -e '#!/bin/sh\ncd "$(dirname "$0")"\nexec ./usr/bin/dfnotes "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          
          # Run appimagetool
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir dfnotes-appimage.appimage

      # --- WINDOWS BUILD (.exe) ---
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --release
          cp target/release/dfnotes.exe dfnotes-windows.exe

      # --- MACOS BUILD (.dmg) ---
      - name: Build and Package MacOS
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release
          # Install dmgbuild to create a proper .dmg file
          pip3 install dmgbuild
          
          # Create a folder to be packed into the DMG
          mkdir -p dist_macos
          cp target/release/dfnotes dist_macos/
          
          # Generate the DMG
          dmgbuild -s /dev/null -D app_folder=dist_macos "dfnotes" dfnotes-macos.dmg

      # --- UPLOAD ALL ARTIFACTS ---
      - name: Upload Finished Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dfnotes-debian.deb
            dfnotes-redhat.rpm
            dfnotes-appimage.appimage
            dfnotes-windows.exe
            dfnotes-macos.dmg
          if-no-files-found: ignore
